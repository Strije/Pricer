# nginx перед Pricer. setup.sh кладёт его в /etc/nginx/sites-available/pricer, подставив адрес;
# HTTPS (сертификат Let's Encrypt, 443, перенаправление с 80) дописывает certbot.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    client_max_body_size 10m;   # файлы заказов и settings.json
    access_log off;             # в адресах есть ссылки подборов — журнал не ведём

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location / {
        proxy_pass http://127.0.0.1:8095;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;    # поиск по всем поставщикам и «ТО по машине» идут минуты
        # события поиска (SSE) — сразу, без буфера
        proxy_buffering off;
        proxy_cache off;
    }
}
