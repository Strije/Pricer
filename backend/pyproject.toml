[project]
name = "pricer-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.28.0",
    "zeep>=4.2.0",
    "openpyxl>=3.1.0",
    "py7zr>=1.1.3",
    "xlrd>=2.0.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "cryptography>=42",
    "python-multipart>=0.0.9",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
# Модули ядра пока плоские (import provider_adapter); пакет core появится на следующем шаге.
pythonpath = [".", "core", "integrations"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Код запускается из папки backend (pythonpath задан выше и в app/server.py), пакетом он не ставится:
# pip install -e . нужен только ради зависимостей.
packages = []
