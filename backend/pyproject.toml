[project]
name = "pricer-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.28.0",
    "zeep>=4.2.0",
    "openpyxl>=3.1.0",
    "py7zr>=1.1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
# Модули ядра пока плоские (import provider_adapter); пакет core появится на следующем шаге.
pythonpath = ["core", "integrations"]
testpaths = ["tests"]
